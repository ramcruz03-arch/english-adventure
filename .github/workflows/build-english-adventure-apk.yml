name: Build English Adventure APK

on:
  workflow_dispatch:
  push:
    paths:
      - "artifacts/english-adventure/**"
      - ".github/workflows/build-english-adventure-apk.yml"

jobs:
  android-apk:
    name: Validate and build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/english-adventure

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate bundled content
        run: dart run tools/validate_content.dart

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build installable release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: english-adventure-apk
          path: artifacts/english-adventure/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

name: English Adventure Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract Flutter project
        id: project
        shell: bash
        run: |
          set -e
          echo "Searching repository for Flutter project ZIP..."

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          PUBSPEC=$(find extracted -type f -name "pubspec.yaml" | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml was not found inside the ZIP."
            find extracted -maxdepth 4 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "Flutter project found: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        run: flutter --version

      - name: Get dependencies
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        shell: bash
        run: |
          echo "Running Flutter analysis..."
          flutter analyze --no-fatal-infos || true
          echo "Analysis completed. Continuing to build."

      - name: Test
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        shell: bash
        run: |
          if [ -d "test" ] && find test -type f -name "*_test.dart" | grep -q .; then
            flutter test
          else
            echo "No tests found. Skipping."
          fi

      - name: Validate content
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        shell: bash
        run: |
          if [ -f "tools/validate_content.dart" ]; then
            dart run tools/validate_content.dart
          else
            echo "Content validator not found. Skipping."
          fi

      - name: Build APK
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: english-adventure-apk
          path: ${{ steps.project.outputs.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

name: English Adventure Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  # Google Play identity. Cannot be changed after your first release.
  APP_ID: com.ramcruz.englishadventure
  APP_LABEL: English Adventure

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract Flutter project
        id: project
        shell: bash
        run: |
          set -e

          echo "Searching for Flutter ZIP..."

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Found: $ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          PUBSPEC=$(find extracted -type f -name "pubspec.yaml" | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found."
            find extracted -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "Flutter project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        run: flutter --version

      - name: Get dependencies
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        run: flutter pub get

      - name: Generate Android platform files
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ ! -f "android/app/build.gradle" ] && [ ! -f "android/app/build.gradle.kts" ]; then
            echo "Generating Android platform files..."
            flutter create \
              --platforms=android \
              --project-name english_adventure \
              .
          else
            echo "Android project already exists."
          fi

      - name: Configure package name, label and signing
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          SIGN_FLAG=""

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Keystore secret found - configuring release signing."

            echo "$KEYSTORE_BASE64" | base64 -d > "$PWD/android/upload-keystore.jks"

            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=$PWD/android/upload-keystore.jks"
            } > "$PWD/android/key.properties"

            SIGN_FLAG="--sign"
          else
            echo "No keystore secret - the build will use the debug key."
            echo "Fine for sideloading, rejected by Google Play."
          fi

          python3 tools/configure_android.py \
            --app-id "$APP_ID" \
            --app-label "$APP_LABEL" \
            $SIGN_FLAG

      - name: Analyze
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        shell: bash
        run: |
          # No "|| true" here on purpose: a Dart error should stop the run in
          # eight seconds with a readable message, not surface as a Gradle
          # failure two minutes later.
          flutter analyze --no-fatal-infos

      - name: Test
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        shell: bash
        run: flutter test

      - name: Validate content
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        shell: bash
        run: |
          if [ -f "tools/validate_content.dart" ]; then
            dart run tools/validate_content.dart
          else
            echo "Content validator not found. Skipping."
          fi

          # Every word of every passage must be decodable with code taught
          # at or before its island. This is the promise the whole course
          # rests on, so a single undecodable word fails the build.
          if [ -f "tools/phonics.py" ]; then
            python3 tools/phonics.py assets/content/levels.json
          else
            echo "Decodability checker not found. Skipping."
          fi

      - name: Build APK
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        shell: bash
        run: |
          flutter build apk --release

          APK="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi
          ls -lh "$APK"

      - name: Build App Bundle
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        shell: bash
        run: |
          flutter build appbundle --release

          AAB="build/app/outputs/bundle/release/app-release.aab"
          if [ -f "$AAB" ]; then
            ls -lh "$AAB"
          else
            echo "WARNING: App Bundle was not created."
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: english-adventure-release-apk
          path: ${{ steps.project.outputs.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: english-adventure-release-aab
          path: ${{ steps.project.outputs.PROJECT_DIR }}/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
          retention-days: 14

name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Flutter project
        run: |
          echo "Searching for Flutter project..."
          find . -type f -name pubspec.yaml -print

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Detect project directory
        id: project
        run: |
          PUBSPEC=$(find . -type f -name pubspec.yaml -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "Flutter project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Flutter version
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        run: flutter --version

      - name: Resolve dependencies
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        run: flutter analyze --no-fatal-infos

      - name: Test
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        run: flutter test

      - name: Validate content pack
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        run: dart run tools/validate_content.dart

      - name: Build APK
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: english-adventure-apk
          path: ${{ steps.project.outputs.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

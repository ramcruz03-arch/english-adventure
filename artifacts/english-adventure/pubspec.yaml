name: english_adventure
description: A playful systematic-phonics reading and writing adventure for beginner readers.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1     # DI + state, no codegen needed
  sqflite: ^2.3.3              # local-first progress store
  path: ^1.9.0
  flutter_tts: ^4.0.2          # MVP audio; recorded voices drop in later
  shared_preferences: ^2.2.3
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
  assets:
    - assets/content/
    - assets/content/lessons/
    - assets/content/illustrations/
  fonts:
    - family: Andika
      fonts:
        - asset: assets/fonts/Andika-Regular.ttf
        - asset: assets/fonts/Andika-Bold.ttf
          weight: 700
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend-Variable.ttf
    - family: BalooThambi2
      fonts:
        - asset: assets/fonts/BalooThambi2-Variable.ttf

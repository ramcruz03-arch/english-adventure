name: Build English Adventure APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "artifacts/english-adventure/**"
      - ".github/workflows/build-english-adventure-apk.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    name: Validate and build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/english-adventure

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate bundled content
        run: dart run tools/validate_content.dart

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test

      # NOTE: without a release keystore this APK is debug-signed.
      # It installs fine for testing, but cannot be published to Play Store
      # and will not upgrade over a properly signed build.
      # To sign for real, decode a keystore from secrets here and configure
      # android/key.properties before this step.
      - name: Build installable release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: english-adventure-apk
          path: artifacts/english-adventure/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

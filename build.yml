name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Flutter project
        id: project
        shell: bash
        run: |
          set -e
          PUBSPEC="$(find . -type f -name pubspec.yaml -not -path './.git/*' | head -n 1)"
          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC")"
          if [ "$PROJECT_DIR" = "." ]; then
            PROJECT_DIR="."
          fi

          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        run: flutter --version

      - name: Get dependencies
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        shell: bash
        run: |
          echo "Running Dart/Flutter analysis..."
          flutter analyze --no-fatal-infos || true
          echo "Analysis completed; build will be the final compilation check."

      - name: Test
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        shell: bash
        run: |
          if [ -d "test" ] && find test -type f -name '*_test.dart' | grep -q .; then
            flutter test
          else
            echo "No Dart tests found; skipping tests."
          fi

      - name: Validate content pack
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        shell: bash
        run: |
          if [ -f "tools/validate_content.dart" ]; then
            dart run tools/validate_content.dart
          else
            echo "No content validator found; skipping."
          fi

      - name: Build release APK
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: english-adventure-apk
          path: ${{ steps.project.outputs.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
